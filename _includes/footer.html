<footer class="site-footer">
  <p class="footer-links">
    {%- for l in profile.links %}<a href="{{ l.url | relative_url }}">{{ l.name }}</a>{% unless forloop.last %}<span class="sep" aria-hidden="true"> · </span>{% endunless %}{% endfor -%}
    <span class="sep" aria-hidden="true"> · </span><a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </p>
  <p class="footer-copy">© {{ site.time | date: "%Y" }} {{ profile.name }}</p>
</footer>
