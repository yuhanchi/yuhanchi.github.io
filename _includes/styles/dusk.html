<body class="s-dusk k-{{ page.kind }}">
  <div class="wrap">
    <header class="masthead">
      <a class="brand" href="{{ base }}/">{{ profile.name }}</a>
      {% include nav.html %}
    </header>
    {%- if page.kind == "about" %}
    <p class="display" aria-hidden="true">Yuhan <em>Chi</em><span class="display-native" lang="zh">{{ profile.native_name }}</span></p>
    {%- endif %}
    <main id="main">
      {% include main.html %}
    </main>
    {% include footer.html %}
  </div>
  {% include switcher.html %}
</body>
