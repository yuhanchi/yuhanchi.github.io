publications:
  - title: "Calibrating What Behavior Can Identify: Conformal Reward Sets for Inverse Reinforcement Learning"
    short: CP-IRL
    authors: Yuhan Chi
    venue: NeurIPS 2026 Workshop on Physical Understanding for Decision-Making (PUDM)
    venue_short: NeurIPS 2026 Workshop (PUDM)
    year: 2026
    note: Poster
    summary: >-
      Adapts conformal inverse optimization to IRL with a coordinate-invariant,
      policy-value-based score, characterizes when behavioral compatibility
      implies true-reward coverage, and proves when robust planning over the
      resulting set cannot certify improvement over a reference policy.
    links:
      - { name: Paper, url: "https://openreview.net/forum?id=GZXE6lszVW" }
      - { name: Code, url: "https://github.com/Chi-Shan0707/cp-irl" }
      - { name: Project, url: "https://chi-shan0707.github.io/cp-irl/" }
  - title: Token-Level Verification under Controlled Evaluation
    short: Token verification
    authors: Yuhan Chi
    venue: ICML 2026 Workshop on AI for Math (AI4Math)
    venue_short: ICML 2026 Workshop (AI4Math)
    year: 2026
    note: Poster
    summary: >-
      Shows that evaluation-protocol choices alone shift the apparent
      verification AUROC of LLM math traces by up to 0.18; under controlled
      scoring, shallow token statistics are diagnostics rather than reliable
      standalone verifiers.
    links:
      - { name: Paper, url: "https://openreview.net/forum?id=wRImV3kfR1" }
      - { name: Code, url: "https://github.com/Chi-Shan0707/token-verification-mirage" }

