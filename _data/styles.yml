# Every design variant. Each one lives at /<id>/ and is rendered by
# _includes/styles/<id>.html + assets/css/<id>.css (on top of base.css).
# After editing this list or adding posts, run: python3 scripts/make_previews.py
# `fonts` is a Google Fonts css2 query; designs with self-hosted/CDN fonts leave it empty.

# ---- academic ----
- id: scholar
  name: Scholar
  blurb: Classic academic homepage — ivory paper, navy ink, EB Garamond with small-caps headings.
  swatches: ["#faf8f2", "#1f2a3a", "#2c4a6e", "#e6e0d2"]
  fonts: "family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond+SC:wght@400;500"

- id: article
  name: Article
  blurb: Typeset like a LaTeX paper — Latin Modern, centered title block, an abstract, numbered sections.
  swatches: ["#fdfdfb", "#1b1b1b", "#7a2d2d", "#e8e6e0"]
  fonts: ""

- id: tufte
  name: Tufte
  blurb: Edward Tufte's handout style — ET Book on cream, a wide margin for the photo, dates and notes.
  swatches: ["#fffff8", "#111111", "#7d2f2f", "#ecebdf"]
  fonts: ""

- id: classic
  name: Classic
  blurb: The familiar researcher page — name and bio beside a photo, a tidy publication list, Lato and calm blue links.
  swatches: ["#ffffff", "#222222", "#2a5d8f", "#e9ecef"]
  fonts: "family=Lato:ital,wght@0,400;0,700;1,400"

- id: faculty
  name: Faculty
  blurb: A university profile page — a deep teal header band, a contact card beside the bio, Noto Sans and Serif.
  swatches: ["#f6f7f7", "#20333f", "#23566b", "#ffffff"]
  fonts: "family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400"

- id: oxford
  name: Oxford
  blurb: Formal and collegiate — Oxford blue on parchment, Caslon type, double rules and small capitals.
  swatches: ["#f8f5ec", "#1d2533", "#1f3a60", "#e5dfcf"]
  fonts: "family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400"

- id: claret
  name: Claret
  blurb: Burgundy and warm white; a sticky profile column with contact details and Crimson Pro text.
  swatches: ["#fbf9f6", "#2b2326", "#7b2d3b", "#ece5e0"]
  fonts: "family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400"

- id: ivy
  name: Ivy
  blurb: Deep ivy green, Libre Baskerville text and Cormorant small-caps headings; quietly traditional.
  swatches: ["#f7f6f0", "#22291f", "#2e5339", "#e3e5d8"]
  fonts: "family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+SC:wght@500;600"

- id: monograph
  name: Monograph
  blurb: Book-like — running head, centered small-caps section titles, ornaments and a drop cap, set in Spectral.
  swatches: ["#f6f4ee", "#2a2925", "#5b6b5e", "#e3dfd3"]
  fonts: "family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Spectral+SC:wght@500"

- id: distill
  name: Distill
  blurb: A research-journal look in the spirit of Distill — sans headings, serif text, a byline grid on posts.
  swatches: ["#ffffff", "#1f2328", "#3b6e8f", "#eef1f4"]
  fonts: "family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400"

# ---- earlier round ----
- id: paper
  name: Paper
  blurb: A single quiet column of serif text on warm ivory, like a well-set essay.
  swatches: ["#f8f5ee", "#2b2925", "#5f7a5c", "#e7e1d4"]
  fonts: "family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400"

- id: sage
  name: Sage
  blurb: A calm sidebar layout in pale sage and soft green, sans-serif with serif reading pages.
  swatches: ["#f2f4ef", "#263027", "#4f7a5a", "#dfe6db"]
  fonts: "family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400"

- id: mist
  name: Mist
  blurb: Cool grey-blue, centered header, IBM Plex; clean lists separated by hairlines.
  swatches: ["#f5f7f9", "#24303b", "#50739a", "#e1e7ed"]
  fonts: "family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400"

- id: linen
  name: Linen
  blurb: Sand and terracotta with an elegant Garamond display face.
  swatches: ["#f6f1e9", "#3a302a", "#a5604a", "#e8ddcd"]
  fonts: "family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mulish:ital,wght@0,400;0,600;1,400"

- id: forest
  name: Forest
  blurb: A soft dark theme — deep green-charcoal, cream text and moss accents.
  swatches: ["#1c211e", "#dfe3d6", "#a7c296", "#2a312c"]
  fonts: "family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600"

- id: ledger
  name: Ledger
  blurb: A structured index with section labels in the margin, monospace details and an ochre accent.
  swatches: ["#fbfaf6", "#22211f", "#9c7731", "#ebe7dc"]
  fonts: "family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400"

- id: washi
  name: Washi
  blurb: Japanese-inspired restraint — rice-paper tones, indigo ink, Mincho type.
  swatches: ["#f6f3ea", "#2c2a27", "#3d5b74", "#e6e0d1"]
  fonts: "family=Shippori+Mincho:wght@400;500;600"

- id: clay
  name: Clay
  blurb: Warm and friendly — soft cards with a muted clay accent, Figtree and Lora.
  swatches: ["#f7f1ea", "#3b3330", "#a8684b", "#fffdfa"]
  fonts: "family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400"

- id: dusk
  name: Dusk
  blurb: Muted lavender-grey with a large serif name; modern and editorial.
  swatches: ["#f4f2f5", "#2d2a33", "#6f6194", "#e4e0e9"]
  fonts: "family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400"

- id: stone
  name: Stone
  blurb: Swiss-style grid on warm grey — big typographic name, strict alignment, one olive accent.
  swatches: ["#f1f0ec", "#1e1e1c", "#66702f", "#dcdad3"]
  fonts: "family=Inter+Tight:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400"
